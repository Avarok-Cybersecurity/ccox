name: Record (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  record:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the recording relay
        run: |
          nohup node .github/record/proxy.mjs recorded/raw > relay.log 2>&1 &
          for _ in $(seq 1 50); do grep -q listening relay.log && exit 0; sleep 0.2; done
          cat relay.log; exit 1

      - name: r1-tool-call-pr
        id: r1_tool_call_pr
        continue-on-error: true
        uses: ./
        with:
          provider: openrouter
          endpoint: http://127.0.0.1:8787/api/v1
          api-key: ${{ secrets.OPENROUTER_API_KEY_FREE }}
          model: ${{ vars.OPENROUTER_DEFAULT_FREE_MODEL }}
          structured-mode: tool_call
          allowed-directories: crates/
          compliance-definitions-path: test/fixtures/definitions
          max-diff-bytes: '60000'
          seed: '42'
          reasoning-effort: low
          max-tokens: '8192'
          request-timeout-ms: '300000'
          max-retries: '1'
          comment-on-pr: 'false'
          diff-file: test/fixtures/diffs/pr.diff
          report-dir: recorded/r1-tool-call-pr
          artifact-name: record-report-r1-tool-call-pr
          artifact-retention-days: '7'

      - name: r2-text-pr
        id: r2_text_pr
        continue-on-error: true
        uses: ./
        with:
          provider: openrouter
          endpoint: http://127.0.0.1:8787/api/v1
          api-key: ${{ secrets.OPENROUTER_API_KEY_FREE }}
          model: ${{ vars.OPENROUTER_DEFAULT_FREE_MODEL }}
          structured-mode: text
          allowed-directories: crates/
          compliance-definitions-path: test/fixtures/definitions
          max-diff-bytes: '60000'
          seed: '42'
          reasoning-effort: low
          max-tokens: '8192'
          request-timeout-ms: '300000'
          max-retries: '1'
          comment-on-pr: 'false'
          diff-file: test/fixtures/diffs/pr.diff
          report-dir: recorded/r2-text-pr
          artifact-name: record-report-r2-text-pr
          artifact-retention-days: '7'

      - name: r3-json-schema-pr
        id: r3_json_schema_pr
        continue-on-error: true
        uses: ./
        with:
          provider: openrouter
          endpoint: http://127.0.0.1:8787/api/v1
          api-key: ${{ secrets.OPENROUTER_API_KEY_FREE }}
          model: ${{ vars.OPENROUTER_DEFAULT_FREE_MODEL }}
          structured-mode: json_schema
          allowed-directories: crates/
          compliance-definitions-path: test/fixtures/definitions
          max-diff-bytes: '60000'
          seed: '42'
          reasoning-effort: low
          max-tokens: '8192'
          request-timeout-ms: '300000'
          max-retries: '1'
          comment-on-pr: 'false'
          diff-file: test/fixtures/diffs/pr.diff
          report-dir: recorded/r3-json-schema-pr
          artifact-name: record-report-r3-json-schema-pr
          artifact-retention-days: '7'

      - name: r4-tool-call-compliant
        id: r4_tool_call_compliant
        continue-on-error: true
        uses: ./
        with:
          provider: openrouter
          endpoint: http://127.0.0.1:8787/api/v1
          api-key: ${{ secrets.OPENROUTER_API_KEY_FREE }}
          model: ${{ vars.OPENROUTER_DEFAULT_FREE_MODEL }}
          structured-mode: tool_call
          allowed-directories: crates/ledger-core/
          compliance-definitions-path: test/fixtures/definitions
          max-diff-bytes: '60000'
          seed: '42'
          reasoning-effort: low
          max-tokens: '8192'
          request-timeout-ms: '300000'
          max-retries: '1'
          comment-on-pr: 'false'
          diff-file: test/fixtures/diffs/known-compliant.diff
          report-dir: recorded/r4-tool-call-compliant
          artifact-name: record-report-r4-tool-call-compliant
          artifact-retention-days: '7'

      - name: r5-tool-call-injection
        id: r5_tool_call_injection
        continue-on-error: true
        uses: ./
        with:
          provider: openrouter
          endpoint: http://127.0.0.1:8787/api/v1
          api-key: ${{ secrets.OPENROUTER_API_KEY_FREE }}
          model: ${{ vars.OPENROUTER_DEFAULT_FREE_MODEL }}
          structured-mode: tool_call
          allowed-directories: crates/
          compliance-definitions-path: test/fixtures/definitions
          max-diff-bytes: '60000'
          seed: '42'
          reasoning-effort: low
          max-tokens: '8192'
          request-timeout-ms: '300000'
          max-retries: '1'
          comment-on-pr: 'false'
          diff-file: test/fixtures/diffs/injection.diff
          report-dir: recorded/r5-tool-call-injection
          artifact-name: record-report-r5-tool-call-injection
          artifact-retention-days: '7'

      - name: r6-tool-call-tiny-budget
        id: r6_tool_call_tiny_budget
        continue-on-error: true
        uses: ./
        with:
          provider: openrouter
          endpoint: http://127.0.0.1:8787/api/v1
          api-key: ${{ secrets.OPENROUTER_API_KEY_FREE }}
          model: ${{ vars.OPENROUTER_DEFAULT_FREE_MODEL }}
          structured-mode: tool_call
          allowed-directories: crates/
          compliance-definitions-path: test/fixtures/definitions
          max-diff-bytes: '60000'
          seed: '42'
          reasoning-effort: low
          max-tokens: '256'
          request-timeout-ms: '300000'
          max-retries: '1'
          comment-on-pr: 'false'
          diff-file: test/fixtures/diffs/pr.diff
          report-dir: recorded/r6-tool-call-tiny-budget
          artifact-name: record-report-r6-tool-call-tiny-budget
          artifact-retention-days: '7'

      - name: List recordings
        if: always()
        run: |
          ls -la recorded/raw
          for f in recorded/raw/*.status; do echo "$f: $(cat "$f")"; done

      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recorded-raw
          path: recorded/raw
          retention-days: 7

  action-identity:
    # Does report.action carry repository/ref when CCOX runs as a remote action?
    # The pinned commit has no bundled compliances/, so it errors before any
    # model call; the identity is recorded regardless.
    runs-on: ubuntu-latest
    steps:
      - name: CCOX as a remote action
        id: ccox
        continue-on-error: true
        uses: Avarok-Cybersecurity/ccox@854e159fa6df1a1aac2ecd45ded6517d18884aca
        with:
          provider: openai-compatible
          endpoint: http://127.0.0.1:9/v1
          api-key: not-a-real-key
          model: probe
          structured-mode: tool_call
          allowed-directories: crates/
          max-diff-bytes: '60000'
          seed: '1'
          reasoning-effort: none
          max-tokens: '1024'
          request-timeout-ms: '5000'
          max-retries: '1'
          comment-on-pr: 'false'
          diff-file: none.diff
          report-dir: probe
          artifact-name: action-identity-probe
          artifact-retention-days: '1'

      - name: Print report.action
        env:
          REPORT_FILE: ${{ steps.ccox.outputs.report-file }}
        run: |
          node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log(JSON.stringify({ action: r.action, error: r.error }))' "$REPORT_FILE"
